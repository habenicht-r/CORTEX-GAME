<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Network Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(circle at 30% 20%, #0b1329 0%, #040812 45%, #02040a 100%);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      color: #d8e9ff;
    }

    #c { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      pointer-events: none;
      color: rgba(148, 200, 255, 0.8);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(80, 150, 255, 0.45);
      opacity: 0.7;
    }

    #statusDot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: #76d8ff;
      box-shadow: 0 0 12px #76d8ff;
    }

    #layer2d {
      position: fixed;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      width: min(36vw, 430px);
      height: min(58vh, 520px);
      border: 1px solid rgba(128, 200, 255, 0.32);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(5, 14, 28, 0.4), rgba(4, 10, 22, 0.76));
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(140, 210, 255, 0.07);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
      backdrop-filter: blur(6px);
    }

    #layer2d.active {
      opacity: 1;
      pointer-events: auto;
    }

    #layer2d canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
      cursor: crosshair;
    }

    #badge {
      position: fixed;
      left: 18px;
      top: 18px;
      border-radius: 999px;
      padding: 7px 14px;
      background: rgba(3, 10, 20, 0.48);
      border: 1px solid rgba(111, 176, 255, 0.28);
      color: rgba(186, 220, 255, 0.9);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="badge">Network Focus</div>
  <div id="hud"><span id="statusDot"></span><span id="hintText">Orbit mit Drag · Zoom mit Scroll · Klick auf Layer für Fokus</span></div>
  <div id="layer2d"><canvas id="layerEditor"></canvas></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x02040a, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.0075);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 0, 132);

    function glowTexture(size = 128) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const h = size / 2;
      const g = ctx.createRadialGradient(h, h, 0, h, h, h);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.12, 'rgba(255,255,255,0.85)');
      g.addColorStop(0.35, 'rgba(180,220,255,0.2)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    const GLOW = glowTexture();
    const world = new THREE.Group();
    scene.add(world);

    const layerDefs = [
      { count: 12, x: -58, spreadY: 16, spreadZ: 16, colorShift: 0.56 },
      { count: 24, x: -30, spreadY: 24, spreadZ: 24, colorShift: 0.52 },
      { count: 36, x: 0, spreadY: 28, spreadZ: 28, colorShift: 0.50 },
      { count: 26, x: 30, spreadY: 24, spreadZ: 24, colorShift: 0.06 },
      { count: 14, x: 58, spreadY: 16, spreadZ: 16, colorShift: 0.03 }
    ];

    const nodes = [];
    const layers = [];
    const sphere = new THREE.SphereGeometry(1, 12, 12);

    layerDefs.forEach((ld, li) => {
      const layerGroup = new THREE.Group();
      world.add(layerGroup);

      const panelGeo = new THREE.PlaneGeometry(23, 56);
      const panelMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(ld.colorShift, 0.6, 0.4),
        transparent: true,
        opacity: 0.06,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const panel = new THREE.Mesh(panelGeo, panelMat);
      panel.position.set(ld.x, 0, 0);
      panel.rotation.y = Math.PI / 2;
      panel.userData.layerIndex = li;
      world.add(panel);

      const frameGeo = new THREE.EdgesGeometry(panelGeo);
      const frameMat = new THREE.LineBasicMaterial({ color: 0x5c94d8, transparent: true, opacity: 0.22 });
      const frame = new THREE.LineSegments(frameGeo, frameMat);
      frame.position.copy(panel.position);
      frame.rotation.copy(panel.rotation);
      world.add(frame);

      const layerNodes = [];
      for (let i = 0; i < ld.count; i++) {
        const x = ld.x + (Math.random() - 0.5) * 5;
        const y = (Math.random() - 0.5) * ld.spreadY;
        const z = (Math.random() - 0.5) * ld.spreadZ;
        const hue = ld.colorShift + (Math.random() - 0.5) * 0.05;
        const lit = 0.46 + Math.random() * 0.28;
        const radius = 0.35 + Math.random() * 0.55;

        const color = new THREE.Color().setHSL(hue, 0.9, lit);
        const mesh = new THREE.Mesh(
          sphere,
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
        );
        mesh.position.set(x, y, z);
        mesh.scale.setScalar(radius);
        layerGroup.add(mesh);

        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: GLOW,
          color,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0.55
        }));
        const gs = 4 + radius * 6;
        glow.scale.set(gs, gs, 1);
        glow.position.copy(mesh.position);
        layerGroup.add(glow);

        const node = { layer: li, mesh, glow, baseScale: radius, color, phase: Math.random() * Math.PI * 2 };
        nodes.push(node);
        layerNodes.push(node);
      }

      layers.push({ index: li, x: ld.x, nodes: layerNodes, panel, frame, panelMat, frameMat });
    });

    const edgePos = [];
    const edgeCol = [];
    const edgePairs = [];

    for (let i = 0; i < nodes.length; i++) {
      let connections = 0;
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const layerDiff = Math.abs(a.layer - b.layer);
        if (layerDiff > 1) continue;
        const dist = a.mesh.position.distanceTo(b.mesh.position);
        if (dist < 30 && connections < 6 && Math.random() > 0.28) {
          const ap = a.mesh.position, bp = b.mesh.position;
          edgePos.push(ap.x, ap.y, ap.z, bp.x, bp.y, bp.z);
          edgeCol.push(a.color.r, a.color.g, a.color.b, b.color.r, b.color.g, b.color.b);
          edgePairs.push([i, j]);
          connections++;
        }
      }
    }

    const edgeGeo = new THREE.BufferGeometry();
    edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
    edgeGeo.setAttribute('color', new THREE.Float32BufferAttribute(edgeCol, 3));
    const edgeMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
    world.add(edgeLines);

    const dustCount = 180;
    const dPos = new Float32Array(dustCount * 3);
    const dCol = new Float32Array(dustCount * 3);
    const dVel = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dPos[i * 3] = (Math.random() - 0.5) * 220;
      dPos[i * 3 + 1] = (Math.random() - 0.5) * 160;
      dPos[i * 3 + 2] = (Math.random() - 0.5) * 160;
      dVel[i * 3] = (Math.random() - 0.5) * 0.02;
      dVel[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
      dVel[i * 3 + 2] = (Math.random() - 0.5) * 0.01;
      const c = new THREE.Color().setHSL(Math.random() > 0.5 ? 0.56 : 0.04, 0.8, 0.5);
      dCol[i * 3] = c.r; dCol[i * 3 + 1] = c.g; dCol[i * 3 + 2] = c.b;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      size: 0.65, vertexColors: true, transparent: true, opacity: 0.25,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    scene.add(dust);

    const hintText = document.getElementById('hintText');
    const layer2dWrap = document.getElementById('layer2d');
    const editorCanvas = document.getElementById('layerEditor');
    const ectx = editorCanvas.getContext('2d');

    const state = {
      target: new THREE.Vector3(0, 0, 0),
      distance: 132,
      yaw: 0.22,
      pitch: -0.12,
      dragMode: null,
      focusedLayer: null,
      hoveredLayer: null,
      zoomedOutThreshold: 112,
      cameraTween: null
    };

    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      keys.add(e.code);
      if (e.code === 'Escape') returnToOverview();
      if (e.code === 'BracketRight') focusLayer(Math.min((state.focusedLayer ?? 0) + 1, layers.length - 1));
      if (e.code === 'BracketLeft') focusLayer(Math.max((state.focusedLayer ?? 0) - 1, 0));
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    function pointerPos(ev) {
      const t = ev.touches ? ev.touches[0] : ev;
      return { x: t.clientX, y: t.clientY };
    }

    let px = 0, py = 0;
    canvas.addEventListener('mousedown', (e) => {
      px = e.clientX; py = e.clientY;
      state.dragMode = e.button === 2 ? 'pan' : 'orbit';
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('mouseup', () => state.dragMode = null);
    window.addEventListener('mousemove', (e) => {
      handleHover(e);
      if (!state.dragMode) return;
      const dx = e.clientX - px;
      const dy = e.clientY - py;
      px = e.clientX; py = e.clientY;
      if (state.dragMode === 'orbit') {
        state.yaw -= dx * 0.004;
        state.pitch = THREE.MathUtils.clamp(state.pitch - dy * 0.0036, -1.2, 1.2);
      } else {
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw);
        const up = new THREE.Vector3(0, 1, 0);
        state.target.addScaledVector(right, -dx * 0.05);
        state.target.addScaledVector(up, dy * 0.05);
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      const p = pointerPos(e);
      px = p.x; py = p.y;
      state.dragMode = 'orbit';
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!state.dragMode) return;
      const p = pointerPos(e);
      const dx = p.x - px;
      const dy = p.y - py;
      px = p.x; py = p.y;
      state.yaw -= dx * 0.004;
      state.pitch = THREE.MathUtils.clamp(state.pitch - dy * 0.0036, -1.2, 1.2);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => state.dragMode = null);

    canvas.addEventListener('wheel', (e) => {
      state.distance = THREE.MathUtils.clamp(state.distance + e.deltaY * 0.08, 30, 220);
    }, { passive: true });

    const raycaster = new THREE.Raycaster();
    const mouseNdc = new THREE.Vector2();

    function ndcFromEvent(e) {
      mouseNdc.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNdc.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    function handleHover(e) {
      if (state.distance < state.zoomedOutThreshold || state.focusedLayer !== null) {
        state.hoveredLayer = null;
        return;
      }
      ndcFromEvent(e);
      raycaster.setFromCamera(mouseNdc, camera);
      const hits = raycaster.intersectObjects(layers.map(l => l.panel));
      state.hoveredLayer = hits.length ? hits[0].object.userData.layerIndex : null;
    }

    canvas.addEventListener('click', (e) => {
      ndcFromEvent(e);
      raycaster.setFromCamera(mouseNdc, camera);
      const panelHits = raycaster.intersectObjects(layers.map(l => l.panel));
      if (panelHits.length) {
        focusLayer(panelHits[0].object.userData.layerIndex);
      }
    });

    function focusLayer(index) {
      const layer = layers[index];
      if (!layer) return;
      state.focusedLayer = index;
      state.hoveredLayer = null;
      hintText.textContent = `Layer ${index + 1} fokussiert · Klick im 2D-Fenster: Neuron · Ziehen: Verbindung · ESC: Übersicht`;
      layer2dWrap.classList.add('active');

      const from = {
        yaw: state.yaw,
        pitch: state.pitch,
        distance: state.distance,
        target: state.target.clone()
      };
      const to = {
        yaw: -Math.PI / 2,
        pitch: 0,
        distance: 44,
        target: new THREE.Vector3(layer.x, 0, 0)
      };
      state.cameraTween = { t: 0, from, to };
      openEditor(index);
    }

    function returnToOverview() {
      if (state.focusedLayer === null) return;
      state.focusedLayer = null;
      layer2dWrap.classList.remove('active');
      hintText.textContent = 'Orbit mit Drag · Zoom mit Scroll · Klick auf Layer für Fokus';
      const from = {
        yaw: state.yaw,
        pitch: state.pitch,
        distance: state.distance,
        target: state.target.clone()
      };
      const to = {
        yaw: 0.22,
        pitch: -0.12,
        distance: 132,
        target: new THREE.Vector3(0, 0, 0)
      };
      state.cameraTween = { t: 0, from, to };
    }

    function smoothstep(t) { return t * t * (3 - 2 * t); }

    function updateCameraTween(delta) {
      if (!state.cameraTween) return;
      state.cameraTween.t += delta * 1.5;
      const t = Math.min(1, smoothstep(state.cameraTween.t));
      const a = state.cameraTween.from;
      const b = state.cameraTween.to;
      state.yaw = THREE.MathUtils.lerp(a.yaw, b.yaw, t);
      state.pitch = THREE.MathUtils.lerp(a.pitch, b.pitch, t);
      state.distance = THREE.MathUtils.lerp(a.distance, b.distance, t);
      state.target.lerpVectors(a.target, b.target, t);
      if (t >= 1) state.cameraTween = null;
    }

    // ---------- 2D layer editor ----------
    const editorState = {
      activeLayer: null,
      neurons: new Map(),
      links: new Map(),
      dragFrom: null,
      hoverNeuron: null
    };

    function ensureLayerData(layerIndex) {
      if (!editorState.neurons.has(layerIndex)) editorState.neurons.set(layerIndex, []);
      if (!editorState.links.has(layerIndex)) editorState.links.set(layerIndex, []);
    }

    function openEditor(layerIndex) {
      editorState.activeLayer = layerIndex;
      ensureLayerData(layerIndex);
      drawEditor();
    }

    function editorPointer(e) {
      const rect = editorCanvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: ((t.clientX - rect.left) / rect.width) * editorCanvas.width,
        y: ((t.clientY - rect.top) / rect.height) * editorCanvas.height
      };
    }

    function nearestNeuron(p, threshold = 16) {
      const list = editorState.neurons.get(editorState.activeLayer) || [];
      let best = null;
      let bestD = Infinity;
      list.forEach((n, i) => {
        const d = Math.hypot(n.x - p.x, n.y - p.y);
        if (d < threshold && d < bestD) { bestD = d; best = i; }
      });
      return best;
    }

    function drawEditor() {
      const w = Math.max(300, Math.floor(layer2dWrap.clientWidth * window.devicePixelRatio));
      const h = Math.max(300, Math.floor(layer2dWrap.clientHeight * window.devicePixelRatio));
      if (editorCanvas.width !== w || editorCanvas.height !== h) {
        editorCanvas.width = w;
        editorCanvas.height = h;
      }

      ectx.clearRect(0, 0, w, h);
      ectx.fillStyle = 'rgba(4,12,25,0.76)';
      ectx.fillRect(0, 0, w, h);

      ectx.strokeStyle = 'rgba(112,180,255,0.12)';
      ectx.lineWidth = 1;
      for (let x = 0; x < w; x += Math.round(w / 10)) {
        ectx.beginPath(); ectx.moveTo(x, 0); ectx.lineTo(x, h); ectx.stroke();
      }
      for (let y = 0; y < h; y += Math.round(h / 10)) {
        ectx.beginPath(); ectx.moveTo(0, y); ectx.lineTo(w, y); ectx.stroke();
      }

      const layerIndex = editorState.activeLayer;
      if (layerIndex === null) return;

      const links = editorState.links.get(layerIndex) || [];
      const neurons = editorState.neurons.get(layerIndex) || [];

      ectx.lineWidth = 2;
      links.forEach(([a, b]) => {
        const na = neurons[a], nb = neurons[b];
        if (!na || !nb) return;
        const g = ectx.createLinearGradient(na.x, na.y, nb.x, nb.y);
        g.addColorStop(0, 'rgba(82,201,255,0.82)');
        g.addColorStop(1, 'rgba(255,145,95,0.82)');
        ectx.strokeStyle = g;
        ectx.beginPath();
        ectx.moveTo(na.x, na.y);
        ectx.lineTo(nb.x, nb.y);
        ectx.stroke();
      });

      neurons.forEach((n, i) => {
        const isHover = i === editorState.hoverNeuron;
        const r = isHover ? 10 : 7;
        ectx.beginPath();
        ectx.fillStyle = isHover ? 'rgba(130,230,255,0.95)' : 'rgba(120,188,255,0.9)';
        ectx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ectx.fill();

        ectx.beginPath();
        ectx.strokeStyle = 'rgba(195,231,255,0.5)';
        ectx.lineWidth = 1.5;
        ectx.arc(n.x, n.y, r + 4, 0, Math.PI * 2);
        ectx.stroke();
      });

      if (editorState.dragFrom && editorState.dragFrom.pointer) {
        const start = neurons[editorState.dragFrom.index];
        const p = editorState.dragFrom.pointer;
        if (start) {
          ectx.setLineDash([7, 6]);
          ectx.strokeStyle = 'rgba(130,216,255,0.7)';
          ectx.lineWidth = 1.5;
          ectx.beginPath();
          ectx.moveTo(start.x, start.y);
          ectx.lineTo(p.x, p.y);
          ectx.stroke();
          ectx.setLineDash([]);
        }
      }
    }

    editorCanvas.addEventListener('mousemove', (e) => {
      if (editorState.activeLayer === null) return;
      const p = editorPointer(e);
      editorState.hoverNeuron = nearestNeuron(p, 15);
      if (editorState.dragFrom) editorState.dragFrom.pointer = p;
      drawEditor();
    });

    editorCanvas.addEventListener('mousedown', (e) => {
      if (editorState.activeLayer === null) return;
      const p = editorPointer(e);
      const hit = nearestNeuron(p, 15);
      if (hit !== null) {
        editorState.dragFrom = { index: hit, pointer: p };
      } else {
        const neurons = editorState.neurons.get(editorState.activeLayer);
        neurons.push(p);
        drawEditor();
      }
    });

    editorCanvas.addEventListener('mouseup', (e) => {
      if (!editorState.dragFrom || editorState.activeLayer === null) return;
      const p = editorPointer(e);
      const target = nearestNeuron(p, 16);
      const from = editorState.dragFrom.index;
      if (target !== null && target !== from) {
        const links = editorState.links.get(editorState.activeLayer);
        const exists = links.some(([a, b]) => (a === from && b === target) || (a === target && b === from));
        if (!exists) links.push([from, target]);
      }
      editorState.dragFrom = null;
      drawEditor();
    });

    editorCanvas.addEventListener('mouseleave', () => {
      editorState.hoverNeuron = null;
      drawEditor();
    });

    function updateMovement(delta) {
      const speed = (state.focusedLayer !== null ? 18 : 30) * delta;
      const front = new THREE.Vector3(Math.sin(state.yaw), 0, Math.cos(state.yaw)).normalize();
      const right = new THREE.Vector3(front.z, 0, -front.x).normalize();
      if (keys.has('KeyW')) state.target.addScaledVector(front, speed);
      if (keys.has('KeyS')) state.target.addScaledVector(front, -speed);
      if (keys.has('KeyA')) state.target.addScaledVector(right, -speed);
      if (keys.has('KeyD')) state.target.addScaledVector(right, speed);
      if (keys.has('KeyQ')) state.target.y -= speed;
      if (keys.has('KeyE')) state.target.y += speed;
    }

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.04, (now - last) / 1000);
      last = now;

      updateCameraTween(delta);
      updateMovement(delta);

      const cp = new THREE.Vector3(
        state.target.x + Math.cos(state.pitch) * Math.sin(state.yaw) * state.distance,
        state.target.y + Math.sin(state.pitch) * state.distance,
        state.target.z + Math.cos(state.pitch) * Math.cos(state.yaw) * state.distance
      );
      camera.position.lerp(cp, 0.12);
      camera.lookAt(state.target);

      const t = now * 0.001;
      nodes.forEach((n, idx) => {
        const pulse = 0.5 + 0.5 * Math.sin(t * 1.4 + n.phase + idx * 0.01);
        const focusMul = state.focusedLayer === n.layer ? 1.2 : (state.focusedLayer === null ? 1 : 0.55);
        const s = n.baseScale * (0.88 + pulse * 0.34) * focusMul;
        n.mesh.scale.setScalar(s);
        n.mesh.material.opacity = 0.5 + pulse * 0.4;
        n.glow.material.opacity = 0.18 + pulse * 0.5;
        n.glow.scale.setScalar((4 + n.baseScale * 6) * (0.9 + pulse * 0.45) * focusMul);
      });

      layers.forEach((layer) => {
        const isHovered = state.hoveredLayer === layer.index;
        const isFocused = state.focusedLayer === layer.index;
        const targetPanel = isFocused ? 0.26 : isHovered ? 0.17 : 0.06;
        const targetFrame = isFocused ? 0.95 : isHovered ? 0.66 : 0.22;
        layer.panelMat.opacity += (targetPanel - layer.panelMat.opacity) * 0.12;
        layer.frameMat.opacity += (targetFrame - layer.frameMat.opacity) * 0.12;
      });

      edgeMat.opacity = state.focusedLayer === null ? 0.16 : 0.08;

      for (let i = 0; i < dustCount; i++) {
        dPos[i * 3] += dVel[i * 3];
        dPos[i * 3 + 1] += dVel[i * 3 + 1];
        dPos[i * 3 + 2] += dVel[i * 3 + 2];
        if (Math.abs(dPos[i * 3]) > 110) dVel[i * 3] *= -1;
        if (Math.abs(dPos[i * 3 + 1]) > 80) dVel[i * 3 + 1] *= -1;
        if (Math.abs(dPos[i * 3 + 2]) > 80) dVel[i * 3 + 2] *= -1;
      }
      dustGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate(last);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      drawEditor();
    });
  </script>
</body>
</html>
